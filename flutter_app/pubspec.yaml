name: journey_ai
description: "JOURNEY AI — Explore the World. Discover the Stories. Native cross-platform iOS & Android mobile application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
