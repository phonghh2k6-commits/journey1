<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Journey AI" />
  <link rel="apple-touch-icon" href="images/img_launcher_compass.jpg" />
  <link rel="manifest" href="manifest.json" />
  <title>JOURNEY AI — Explore the World. Discover the Stories.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="web-app-shell" id="appShell">
    <!-- Premium Cinematic Top Header Bar -->
    <header class="top-header">
      <div class="brand-cluster" onclick="window.journeyApp.switchTab('home')">
        <div class="brand-logo-circle" title="Journey AI">
          <img src="images/img_launcher_compass.jpg" alt="Journey AI" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />
        </div>
        <div class="brand-titles">
          <div class="brand-row">
            <span class="brand-name" id="headerBrandName">Journey AI</span>
          </div>
          <span class="user-subtitle" id="headerUserSubtitle">Explore the World. Discover the Stories.</span>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn-ai-scan-pill" onclick="window.journeyApp.switchTab('discover')" id="btnHeaderScan" title="Trải nghiệm Premium &amp; Chụp AI">
          <span>👑</span>
          <span id="labelHeaderScan">Premium</span>
        </button>

        <button class="btn-icon-circle header-chat-btn" onclick="window.journeyApp.openFriendsAndChatHub('friends')" id="btnHeaderFriendsChat" title="Thông báo, Bạn bè &amp; Tin nhắn" aria-label="Thông báo, Bạn bè và Tin nhắn">
          <span>🔔</span>
          <span class="header-unread-dot" id="headerUnreadBadge" style="display:none;">0</span>
        </button>

        <button class="btn-icon-circle" onclick="window.journeyApp.toggleTheme()" id="btnThemeToggle" title="Đổi giao diện Sáng / Tối">
          ☀️
        </button>

        <button class="btn-avatar-pill" onclick="window.journeyApp.switchTab('profile')" id="btnAvatarPopover" aria-label="Hồ sơ cá nhân">
          <span class="avatar-circle" id="headerAvatarCircle">BA</span>
        </button>
      </div>
    </header>

    <!-- Main Responsive Viewport -->
    <main class="main-content" id="mainViewport"></main>

    <!-- Bottom 5-Tab Navigation Bar (Trang chủ | Khám phá | Chụp | Nhật ký | Hồ sơ) -->
    <nav class="bottom-nav" aria-label="Điều hướng chính">
      <button class="nav-tab active" data-tab="home" onclick="window.journeyApp.switchTab('home')">
        <span class="nav-tab-icon">🏠</span>
        <span class="nav-label" id="navHome">Trang chủ</span>
      </button>
      <button class="nav-tab" data-tab="explore" onclick="window.journeyApp.switchTab('explore')">
        <span class="nav-tab-icon">🧭</span>
        <span class="nav-label" id="navExplore">Khám phá</span>
      </button>
      <button class="nav-tab camera-center-tab" data-tab="discover" onclick="window.journeyApp.switchTab('discover')" aria-label="Chụp khám phá">
        <span class="nav-tab-icon">📷</span>
        <span class="nav-label" id="navDiscover">Chụp</span>
      </button>
      <button class="nav-tab" data-tab="journal" onclick="window.journeyApp.switchTab('journal')">
        <span class="nav-tab-icon">📖</span>
        <span class="nav-label" id="navJournal">Nhật ký</span>
      </button>
      <button class="nav-tab" data-tab="profile" onclick="window.journeyApp.switchTab('profile')">
        <span class="nav-tab-icon">👤</span>
        <span class="nav-label" id="navProfile">Hồ sơ</span>
      </button>
    </nav>
  </div>

  <!-- Universal Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) window.journeyApp.closeModal()">
    <div class="modal-card" id="modalContent"></div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-banner" id="toastBanner"></div>

  <script src="app.js"></script>
</body>
</html>
